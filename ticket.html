
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Theatre Ticketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Aurora Theatre</h1>
    <p>Interactive Ticket Booking System</p>
  </header>

  <main>
    <section id="venue">
      <h2>Choose Your Seat</h2>
      <p>Select a seat to see its details.</p>

      <div id="stage">
        <h3>STAGE</h3>
      </div>

      <div id="seat-map">
        <!-- Seats here -->
      </div>
    </section>

    <section id="details">
      <h2>Seat Details</h2>
      <p id="seat-info">
        No seat selected.
      </p>
      <button id="add-to-cart" disabled>
        ADD TO CART
      </button>
    </section>

    <section id="cart">
      <h2>Your Cart</h2>
      <div id="cart-items">
        <p>Your cart is empty.</p>
      </div>
      <h3>Total: <span id="total">0</span> AZN</h3>
    </section>
  </main>
</body>
</html>
